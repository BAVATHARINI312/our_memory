
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Coffee Memory ♡</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #f9e9df, #f5d9c8, #fff3e9);
    color: #634536;
    font-family: Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 75px 18px 55px;
}

.home, .music {
    position: fixed;
    top: 22px;
    z-index: 5;
    text-decoration: none;
    color: #634536;
}

.home { left: 25px; }

.music {
    right: 25px;
    border: 1px solid #b88c7b;
    background: #fff8f1;
    padding: 10px 17px;
    border-radius: 30px;
    cursor: pointer;
}

.content {
    width: min(100%, 560px);
    text-align: center;
}

.heading {
    font-size: 11px;
    letter-spacing: 5px;
    color: #a17a68;
}

h1 {
    font-size: clamp(30px, 6vw, 43px);
    font-weight: normal;
    margin: 15px 0 28px;
}

.notification {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    padding: 17px 20px;
    border-radius: 18px;
    background: rgba(255,255,255,.78);
    box-shadow: 0 12px 30px #805c4620;
    opacity: 0;
    transform: translateY(-25px);
}

.notification.show {
    animation: slideIn .8s ease forwards;
}

.insta {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    background: linear-gradient(45deg,#ffc45b,#e34c87,#7949d6);
    color: white;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
    font-size: 27px;
}

.notify-text strong {
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.notify-text span {
    display: block;
    margin-top: 5px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #826b5d;
}

.photo-wrap {
    margin: 32px auto 20px;
    width: min(82%, 350px);
    padding: 10px 10px 17px;
    background: #fffaf4;
    box-shadow: 0 18px 35px #76533b30;
    border-radius: 5px;
    opacity: 0;
    transform: scale(.45) rotate(-7deg);
}

.photo-wrap.show {
    animation: photoPop 1s cubic-bezier(.2,1.4,.5,1) forwards;
}

.photo-wrap img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
}

.message {
    margin: 20px auto;
    padding: 17px 24px;
    width: fit-content;
    max-width: 100%;
    background: #fff8ef;
    border-radius: 20px;
    box-shadow: 0 8px 20px #805c4615;
    font-size: clamp(23px, 5vw, 31px);
    opacity: 0;
    transform: translateY(12px);
}

.message.show {
    animation: messageIn .8s ease forwards;
}

.continue {
    display: inline-block;
    margin-top: 15px;
    padding: 14px 34px;
    color: white;
    background: #a96f79;
    text-decoration: none;
    border-radius: 30px;
    box-shadow: 0 8px 20px #a96f7940;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
}

.continue.show {
    animation: messageIn .7s ease forwards;
    pointer-events: auto;
}

.continue:hover {
    transform: translateY(-3px);
    background: #87545f;
}

.footer {
    margin-top: 40px;
    font-size: 13px;
    color: #987968;
    letter-spacing: 1px;
}

@keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
}

@keyframes photoPop {
    65% { transform: scale(1.06) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(-2deg); }
}

@keyframes messageIn {
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width: 480px) {
    .home { left: 14px; }
    .music { right: 14px; }
}
</style>
</head>

<body>

<a class="home" href="../index.html">← Home</a>
<button class="music" onclick="toggleMusic()">♫ Play Music</button>

<main class="content">

    <p class="heading">A LITTLE COFFEE MEMORY ♡</p>
    <h1>One unexpected message...</h1>

    <div class="notification" id="notification">
        <div class="insta">◎</div>
        <div class="notify-text">
            <strong>Rohin</strong>
            <span>Sent you a message · now</span>
        </div>
    </div>

    <div class="photo-wrap" id="photo">
        <img src="../images/coffee.png" alt="A warm cup of coffee">
    </div>

    <div class="message" id="message">
        Do you want coffee? ♡
    </div>

    <a href="shifts.html" class="continue" id="continue">
        Continue →
    </a>

    <div class="footer">OUR LITTLE MEMORIES ♡</div>

</main>

<audio id="backgroundMusic" loop>
    <source src="../music/love.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("backgroundMusic");
const musicButton = document.querySelector(".music");

function toggleMusic() {
    if (music.paused) {
        music.play().then(() => {
            musicButton.textContent = "♫ Pause Music";
        }).catch(() => alert("Please check love.mp3."));
    } else {
        music.pause();
        musicButton.textContent = "♫ Play Music";
    }
}

window.addEventListener("load", () => {
    setTimeout(() => {
        document.getElementById("notification").classList.add("show");
    }, 500);

    setTimeout(() => {
        document.getElementById("photo").classList.add("show");
    }, 1600);

    setTimeout(() => {
        document.getElementById("message").classList.add("show");
    }, 2600);

    setTimeout(() => {
        document.getElementById("continue").classList.add("show");
    }, 3400);
});
</script>

</body>
</html>
