
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>That Instagram Memory ♡</title>
<style>
:root {
  --ink: #493c46;
  --muted: #927f8d;
  --pink: #b7859e;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 10% 15%, #f6dfe8 0, transparent 32%),
    radial-gradient(circle at 90% 85%, #e4e5f4 0, transparent 32%),
    #f8f2f1;
}
.topbar {
  height: 62px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 6%;
  border-bottom: 1px solid #ffffffa0;
  background: #fffaf899;
  font: 12px Arial, sans-serif;
  letter-spacing: 1px;
}
.topbar a { color: var(--ink); text-decoration: none; }
.topbar a:hover { color: var(--pink); }

main {
  height: calc(100vh - 112px);
  min-height: 450px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.content {
  width: min(850px, 100%);
  text-align: center;
  animation: appear .65s ease;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
.kicker {
  color: var(--pink);
  font: 10px Arial, sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}
h1 {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: normal;
  margin: 14px 0;
}
.description {
  max-width: 530px;
  margin: 0 auto 22px;
  color: #796b76;
  font-size: 16px;
  line-height: 1.8;
}
.artboard {
  width: min(580px, 100%);
  height: 290px;
  margin: 20px auto;
  border: 1px solid white;
  border-radius: 25px;
  background: linear-gradient(140deg, #f8e9ed, #f4eff7 55%, #e9eeee);
  box-shadow: 0 18px 50px #60485c16;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}
.artboard::before {
  content: "✦";
  position: absolute;
  top: 22px;
  left: 25px;
  color: #b99bad;
}
.artboard::after {
  content: "✧";
  position: absolute;
  bottom: 22px;
  right: 25px;
  color: #b99bad;
}
.phone {
  width: 170px;
  height: 235px;
  padding: 16px 12px;
  border: 6px solid #554c59;
  border-radius: 27px;
  background: #fffdfd;
  box-shadow: 0 15px 30px #53445530;
  font: 11px Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  position: relative;
  animation: phoneFloat 3s ease-in-out infinite;
}
@keyframes phoneFloat {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-7px) rotate(1deg); }
}
.phone::before {
  content: "";
  position: absolute;
  top: 5px;
  width: 40px;
  height: 5px;
  background: #554c59;
  border-radius: 10px;
}
.phone-title {
  font-family: Georgia, serif;
  font-size: 17px;
  margin-top: 7px;
}
.search {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  background: #f0edf1;
  text-align: left;
  color: #6f6371;
}
.profile-pic {
  width: 57px;
  height: 57px;
  border-radius: 50%;
  background: linear-gradient(135deg,#f3dce5,#d8d4e9);
  display: grid;
  place-items: center;
  font-size: 25px;
}
.profile-name { font-weight: bold; font-size: 13px; }
.small-button {
  padding: 8px 18px;
  color: white;
  background: #7297d3;
  border-radius: 7px;
}
.notification {
  position: absolute;
  width: 245px;
  padding: 16px;
  border-radius: 15px;
  background: #ffffffed;
  box-shadow: 0 10px 30px #44344935;
  right: 5%;
  bottom: 12%;
  text-align: left;
  font: 12px/1.5 Arial, sans-serif;
  animation: pop .5s ease;
  z-index: 2;
}
@keyframes pop {
  from { opacity: 0; transform: scale(.7) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.hidden { display: none !important; }
.action-area {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 11px;
  min-height: 45px;
}
.action {
  border: 1px solid #dfcbd5;
  border-radius: 30px;
  padding: 12px 21px;
  background: #fffaf8;
  color: var(--ink);
  cursor: pointer;
  font: 12px Arial, sans-serif;
  transition: .25s;
}
.action:hover {
  transform: translateY(-3px);
  background: #f4e7ed;
}
.action.primary {
  background: #a77f97;
  color: white;
  border-color: #a77f97;
}
.action:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
}
#message {
  min-height: 20px;
  color: #9b7189;
  font: 12px Arial, sans-serif;
  margin-top: 12px;
}
.footer {
  height: 50px;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0 6%;
  background: #fffaf8e8;
  border-top: 1px solid #eadde3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 11px Arial, sans-serif;
  color: var(--muted);
}
.progress-track {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  width: 100%;
  background: #eadde3;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--pink);
  transition: width .4s;
}
.calendar {
  width: 170px;
  height: 190px;
  background: #fffaf8;
  border-radius: 15px;
  box-shadow: 0 15px 30px #53445520;
  overflow: hidden;
  animation: calendarFlip 1s ease;
}
.calendar-head {
  background: #bd91a7;
  color: white;
  padding: 13px;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}
.calendar-body {
  padding: 17px;
  font-size: 17px;
  line-height: 2;
}
@keyframes calendarFlip {
  from { transform: rotateX(75deg); opacity: 0; }
  to { transform: rotateX(0); opacity: 1; }
}
@media(max-height:650px) {
  main { padding: 8px; }
  .artboard { height: 210px; margin: 12px auto; }
  h1 { margin: 8px 0; }
  .description { margin-bottom: 10px; }
}
@media(max-width:500px) {
  .topbar { padding: 0 15px; font-size: 10px; }
  .artboard { height: 240px; }
  .notification { width: 185px; right: 2%; }
  .footer { padding: 0 15px; font-size: 9px; }
}
</style>
</head>

<body>
<header class="topbar">
  <a href="../index.html">← Home</a>
  <span>OUR LITTLE MEMORIES ♡</span>
  <a href="day2.html">Previous memory</a>
</header>

<main>
<section class="content" id="content">
  <div class="kicker" id="kicker"></div>
  <h1 id="heading"></h1>
  <p class="description" id="description"></p>
  <div class="artboard" id="artboard"></div>
  <div class="action-area" id="actions"></div>
  <div id="message"></div>
</section>
</main>

<footer class="footer">
  <span id="stepCount">MEMORY 1 OF 6</span>
  <span>Some bonds have no name ♡</span>
  <span id="percent">0%</span>
  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>
</footer>

<script>
const memories = [
{
 kicker: "A RANDOM DAY AT WORK",
 title: "The question.",
 description: "One day at work, he asked for my Instagram ID. I didn't give it to him. I didn't know that I would search for him later.",
 art: `<div style="font-size:100px;animation:phoneFloat 3s infinite">🏭</div>`,
 button: "Continue to the bus ride →"
},
{
 kicker: "ON THE WAY HOME",
 title: "A little curiosity.",
 description: "After work, on the bus, I opened Instagram and searched for his ID: rohhi.n.",
 art: `<div class="phone">
 <div class="phone-title">Instagram</div>
 <div class="search" id="typing">⌕ </div>
 <div style="color:#a28b9a">Search for someone</div>
 </div>`,
 button: "Search for rohhi.n →"
},
{
 kicker: "THE SEARCH RESULT",
 title: "There he was.",
 description: "His profile appeared on my screen. Just a username, but a moment I still remember.",
 art: `<div class="phone">
 <div class="phone-title">Instagram</div>
 <div class="profile-pic">♡</div>
 <div class="profile-name">rohhi.n</div>
 <div>Instagram profile</div>
 <div class="small-button">View profile</div>
 </div>`,
 button: "Continue →"
},
{
 kicker: "WITHIN TEN MINUTES",
 title: "A follow request!",
 description: "Within ten minutes, he sent me a follow request. I wasn't expecting it.",
 art: `<div class="phone">
 <div class="phone-title">Instagram</div>
 <div class="profile-pic">♡</div>
 <div class="profile-name">rohhi.n</div>
 <div>Follow request</div>
 <div class="small-button">Requested</div>
 </div>
 <div class="notification hidden" id="notification">
 <strong>Instagram</strong><br><br>
 rohhi.n requested to follow you. ♡
 </div>`,
 button: "Show notification →"
},
{
 kicker: "THE NEXT DAY",
 title: "I accepted.",
 description: "I waited until the next day and accepted the request using my personal account, Kannamma — my alter ego.",
 art: `<div class="calendar">
 <div class="calendar-head">A NEW DAY</div>
 <div class="calendar-body">
 <div style="color:#a77f97">THE NEXT DAY</div>
 <div style="font-size:34px">♡</div>
 <div>Request accepted</div>
 </div>
 </div>`,
 button: "Continue →"
},
{
 kicker: "A NEW LITTLE CHAPTER",
 title: "He met Kannamma.",
 description: "That was how he was introduced to Kannamma. And then came a simple conversation about tea, coffee, and an Instagram message.",
 art: `<div style="text-align:center">
 <div style="font-size:100px;animation:phoneFloat 3s infinite">☕</div>
 <div style="font-size:14px;color:#927f8d">A conversation was about to begin...</div>
 </div>`,
 button: "Continue to Coffee Memory →"
}
];

let current = 0;
let unlocked = [true, false, false, false, false, false];
let searchCompleted = false;
let requestRevealed = false;

const content = document.getElementById("content");
const artboard = document.getElementById("artboard");
const actions = document.getElementById("actions");

function render() {
 const m = memories[current];

 content.style.animation = "none";
 void content.offsetWidth;
 content.style.animation = "appear .65s ease";

 document.getElementById("kicker").textContent = m.kicker;
 document.getElementById("heading").textContent = m.title;
 document.getElementById("description").textContent = m.description;
 artboard.innerHTML = m.art;

 document.getElementById("stepCount").textContent =
 `MEMORY ${current + 1} OF ${memories.length}`;

 const percentage = Math.round((current + 1) / memories.length * 100);
 document.getElementById("progress").style.width = percentage + "%";
 document.getElementById("percent").textContent = percentage + "%";
 document.getElementById("message").textContent = "";

 actions.innerHTML = `
 <button class="action" id="backButton" ${current === 0 ? "disabled" : ""}>← Back</button>
 <button class="action primary" id="nextButton">${m.button}</button>
 <button class="action" id="replayButton">↻ Replay</button>
 `;

 document.getElementById("backButton").onclick = () => goTo(current - 1);
 document.getElementById("replayButton").onclick = replay;
 document.getElementById("nextButton").onclick = continueStep;
}

function goTo(index) {
 if (index < 0 || index >= memories.length) return;
 if (!unlocked[index]) return;
 current = index;
 render();
}

function continueStep() {
 if (current === 1) {
  searchUser();
  return;
 }

 if (current === 3) {
  showRequest();
  return;
 }

 if (current === 4) {
  unlocked[5] = true;
  goTo(5);
  return;
 }

 if (current === 5) {
  window.location.href = "coffee.html";
  return;
 }

 if (current < memories.length - 1) {
  unlocked[current + 1] = true;
  goTo(current + 1);
 }
}

function searchUser() {
 if (searchCompleted) {
  unlocked[2] = true;
  goTo(2);
  return;
 }

 const search = document.getElementById("typing");
 const button = document.getElementById("nextButton");
 const message = document.getElementById("message");
 const name = "rohhi.n";
 let i = 0;

 button.disabled = true;
 message.textContent = "Searching for the username...";

 const interval = setInterval(() => {
  i++;
  search.textContent = "⌕ " + name.slice(0, i);

  if (i >= name.length) {
   clearInterval(interval);
   searchCompleted = true;
   unlocked[2] = true;
   message.textContent = "Profile found ♡";
   button.disabled = false;
   button.textContent = "View profile →";
   button.onclick = () => goTo(2);
  }
 }, 180);
}

function showRequest() {
 if (requestRevealed) {
  unlocked[4] = true;
  goTo(4);
  return;
 }

 const notice = document.getElementById("notification");
 if (!notice) return;

 notice.classList.remove("hidden");
 requestRevealed = true;

 document.getElementById("message").textContent =
 "A notification from rohhi.n ♡";

 actions.innerHTML = `
 <button class="action" id="dismissButton">Dismiss</button>
 <button class="action primary" id="acceptLaterButton">Accept later →</button>
 <button class="action" id="replayRequestButton">↻ Replay</button>
 `;

 document.getElementById("dismissButton").onclick = dismissRequest;

 document.getElementById("acceptLaterButton").onclick = () => {
  unlocked[4] = true;
  goTo(4);
 };

 document.getElementById("replayRequestButton").onclick = () => {
  notice.classList.add("hidden");
  requestRevealed = false;
  document.getElementById("message").textContent =
   "Let's see that surprise again. ♡";
 };

 artboard.animate(
  [
   { transform: "translateX(0)" },
   { transform: "translateX(-5px)" },
   { transform: "translateX(5px)" },
   { transform: "translateX(0)" }
  ],
  { duration: 450 }
 );
}

function dismissRequest() {
 document.getElementById("message").textContent =
 "The request is still waiting. ♡";
}

function replay() {
 if (current === 1) searchCompleted = false;
 if (current === 3) requestRevealed = false;
 render();
}

render();
</script>
</body>
</html>
